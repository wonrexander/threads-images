# 광고 쇼츠 예약 게시(post-bot/post_bot.py) — 매일 23:00 KST(=14:00 UTC), 컴퓨터가 꺼져 있어도. 2026-10-24
# GitHub 예약 실행은 붐비면 몇 분~수십 분 늦을 수 있다. 수동 실행(workflow_dispatch)도 된다.
name: post-bot
on:
  schedule:
    # 정각(:00)은 GitHub 예약이 몰려 크게 늦는다(2026-10-24: 14:00 UTC 예약이 17:05 에 돌아 새벽 2시 게시).
    # 정각을 피한 여러 시각에 걸고, post_bot.py 가 '오늘 이미 올렸으면' 건너뛴다(하루 한 편). 22:47 KST 부터.
    - cron: "47 13 * * *"
    - cron: "56 13 * * *"
    - cron: "9 14 * * *"
    - cron: "23 14 * * *"
    - cron: "41 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 게시
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python post-bot/post_bot.py
      - name: 결과 저장(실패해도 일부 결과는 남긴다)
        if: always()
        run: |
          git config user.name "post-bot"
          git config user.email "post-bot@users.noreply.github.com"
          git add -A post-queue post-bot dm-bot videos
          git diff --cached --quiet || (git commit -m "post-bot: 게시 결과 [skip ci]" && git pull --rebase && git push)

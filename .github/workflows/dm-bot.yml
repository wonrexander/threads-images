# 광고 쇼츠 DM 자동답장 + 링크 답글 (dm-bot/dm_bot.py) — 5분마다, 컴퓨터가 꺼져 있어도. 2026-10-24
# GitHub 의 예약 실행은 붐비면 몇 분~십몇 분 늦을 수 있다.
name: dm-bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dm-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DM 자동답장
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python dm-bot/dm_bot.py
      - name: 처리 기록 저장
        run: |
          git config user.name "dm-bot"
          git config user.email "dm-bot@users.noreply.github.com"
          git add dm-bot/state.json
          git diff --cached --quiet || (git commit -m "dm-bot: 처리 기록 [skip ci]" && git pull --rebase && git push)
